name: Wake Up Streamlit App

on:
  schedule:
    - cron: '*/10 * * * *'  # שינוי קריטי: כל 10 דקות
  workflow_dispatch:

jobs:
  selenium_bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install selenium webdriver-manager

      - name: Run Smart Bot
        run: python headless_bot.py
