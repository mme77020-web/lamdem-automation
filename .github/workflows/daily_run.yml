name: Run Lamdem Bot

on:
  schedule:
    # ירוץ כל 3 שעות עגולות (00:00, 03:00, 06:00 וכו') - סה"כ 8 פעמים ביום
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager pandas openpyxl

      - name: Run Bot Script
        run: python headless_bot.py
