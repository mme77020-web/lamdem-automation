name: Wake Up Streamlit App

on:
  schedule:
    # מריץ את הבוט כל 3 שעות
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  ping_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # שים לב: אנחנו בכוונה מדלגים על שלב התקנת הספריות (pip install)
      # כי הבוט הזה צריך רק את מה שמגיע עם פייתון בסיסי

      - name: Run Ping Script
        run: python headless_bot.py
