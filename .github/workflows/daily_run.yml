name: Wake Up Streamlit App

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  selenium_bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install selenium webdriver-manager

      - name: Run Monitor
        run: python headless_bot.py

      # --- החלק החדש: העלאת צילומי המסך כדי שתוכל לראות מה קרה ---
      - name: Upload Debug Screenshots
        if: always() # ירוץ גם אם הבוט נכשל
        uses: actions/upload-artifact@v4
        with:
          name: bot-screenshots
          path: "*.png"
